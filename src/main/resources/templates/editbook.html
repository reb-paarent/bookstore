<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
	<form th:object="${book}" th:action="@{/save}" method="post">
    <input type="hidden" th:field="*{id}" class="form-control"/>
    <input type="text" th:field="*{title}" />
    <input type="text" th:field="*{author}" />
    <input type="text" th:field="*{publicationYear}" />
    <input type="text" th:field="*{isbn}" />
    <input type="text" th:field="*{price}" />
    						
	<label for="deplist">Category</label>
	<select id="deplist" th:field="*{category}" class="form-control">
        <option th:each="category: ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
    </select>

    <input type="submit" class="btn btn-success" value="Save">
</form>
    
</body>
</html>
