<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <h1>Add Book</h1>
    <div>
        <form th:object="${book}" th:action="@{save}" action="#" method="post">
            <label>Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control"></input>

            <label>Author</label>
            <input type="text" id="author" th:field="*{author}" class="form-control"></input>

            <label>Year</label>
            <input type="text" id="publicationYear" th:field="*{publicationYear}" class="form-control"></input>

            <label>ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" class="form-control"></input>

            <label>Price</label>
            <input type="text" id="price" th:field="*{price}" class="form-control"></input>

            <input type="submit" class="btn btn-success" value="Save"></input>
        </form>
    </div>
</body>
</html>
