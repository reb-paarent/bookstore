<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
 xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <p>
    Signed in as <span sec:authentication="name">username</span>
    </p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>

	<table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>ISBN</th>
            <th>Price</th>
            <th>Category</th>
            <th sec:authorize="hasAuthority('ADMIN')"></th>
        </tr>
        <tr th:each = "book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.category.name}"></td>
            <td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/delete/{id}(id=${book.id})}">Delete</a></td>
            <td><a th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
        </tr>
    </table>

    <a href="/add" class="btn btn-primary">Add Book</a>   
</body>
</html>
